<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'KeskIA — Gemini Galvan'">KeskIA — Gemini Galvan</title>
    <!-- Lien vers Bootstrap local -->
    <link rel="stylesheet" th:href="@{/vendor/CSS/bootstrap.min.css}">
    <!-- Thème Azmuth (Ben 10 / Galvan Prime) -->
    <link rel="stylesheet" th:href="@{/css/azmuth.css}">
</head>
<body class="azmuth-ai-console">

<!-- Inclusion du Header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Contenu dynamique de la page -->
<main class="container py-4 main-wrapper">
    <div th:replace="${template} ?: _"></div>
</main>

<!-- Inclusion du Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Script JS de Bootstrap local -->
<script th:src="@{/vendor/JS/bootstrap.bundle.min.js}"></script>
</body>
</html>
